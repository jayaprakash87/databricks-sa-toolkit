[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-sa-kit"
description = "Databricks SA Dev Kit: skills, installer, and engagement tooling for Solution Architects"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = ["PyYAML>=6"]
dynamic = ["version"]

[project.scripts]
sa-kit = "sa_kit.cli:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
