# Solution Orchestration Contract Schema
# Version: 2.1.0
#
# This schema defines the structured YAML contract that the orchestrator
# (00-solution-orchestrator) produces for every use case.
#
# All fields marked [REQUIRED] must be present in every contract.
# All fields marked [OPTIONAL] may be omitted if not applicable.
# Fields marked [ARRAY] may be empty arrays if no items apply.

orchestrator_version: "2.1.0"  # [REQUIRED] Schema version

use_case:  # [REQUIRED] Business use case definition
  name: "string"  # [REQUIRED] Short descriptive name (50 chars max)
  business_problem: "string"  # [REQUIRED] Current friction and business consequence
  business_outcome: "string"  # [REQUIRED] Desired future state and measurable improvement
  persona: "string"  # [REQUIRED] Who makes the decision or takes the action
  decision_or_action: "string"  # [REQUIRED] What specific decision or action to improve
  primary_kpi: "string"  # [REQUIRED] Main KPI with baseline and target
  secondary_kpis:  # [ARRAY] Supporting KPIs
    - "string"

context:  # [REQUIRED] Customer and environmental context
  customer: "string"  # [OPTIONAL] Customer name / industry
  industry: "string"  # [OPTIONAL] Industry vertical
  current_state: "string"  # [REQUIRED] Current technical and business state
  constraints:  # [ARRAY] Constraints affecting solution
    - "string"  # Time, budget, platform, governance, etc.
  known_platforms:  # [ARRAY] Existing platforms and their positioning
    - name: "string"  # [REQUIRED] Platform name
      role: "string"  # [REQUIRED] Lead / Coexist / Integrate / Stay out
      rationale: "string"  # [REQUIRED] Why this positioning

solution_patterns:  # [REQUIRED] Pattern classification and rationale
  primary: "string"  # [REQUIRED] Primary pattern from solution-patterns.yaml
  secondary: []  # [ARRAY] Additional patterns if hybrid use case
  rationale: "string"  # [REQUIRED] Why this pattern fits the use case
  explicitly_not_required:  # [ARRAY] Patterns that do NOT apply
    - pattern: "string"  # [REQUIRED] Pattern name
      reason: "string"  # [REQUIRED] Why not needed

skills:  # [REQUIRED] Skill composition with rationale
  mandatory:  # [ARRAY] Always required skills
    - id: "string"  # [REQUIRED] Skill ID (e.g., "01-business-problem-framing")
      reason: "string"  # [REQUIRED] Why required
  
  conditional:  # [ARRAY] Conditionally required skills
    - id: "string"  # [REQUIRED] Skill ID
      reason: "string"  # [REQUIRED] Why required
      condition: "string"  # [REQUIRED] Under what condition
  
  explicitly_not_required:  # [ARRAY] Skills that are NOT needed
    - id: "string"  # [REQUIRED] Skill ID
      reason: "string"  # [REQUIRED] Why not needed - be explicit
  
  sequence:  # [ARRAY] Recommended execution order
    - "string"  # Skill IDs in order

data:  # [REQUIRED] Data requirements and availability
  required_inputs:  # [ARRAY] Data sources needed
    - name: "string"  # [REQUIRED] Data source / table name
      grain: "string"  # [REQUIRED] Record grain
      volume: "string"  # [OPTIONAL] Approximate size
      latency: "string"  # [REQUIRED] Freshness requirement
      status: "string"  # [REQUIRED] Ready as-is / Needs ingestion / Needs transformation
  
  existing_assets:  # [ARRAY] Existing curated tables/views
    - "string"
  
  missing_assets:  # [ARRAY] Assets to create
    - "string"
  
  latency_requirement: "string"  # [REQUIRED] Batch (hours/days) / Near-real-time (minutes) / Real-time (seconds)
  data_quality_requirements: "string"  # [OPTIONAL] Critical quality rules

architecture:  # [REQUIRED] Architecture pattern and decisions
  logical_pattern: "string"  # [REQUIRED] High-level flow: Source → Process → Serve
  integration_pattern: "string"  # [REQUIRED] Batch / CDC / Streaming / Hybrid
  serving_pattern: "string"  # [REQUIRED] Table / API / Dashboard / App / Embedded
  governance_requirements:  # [ARRAY] Governance needs
    - "string"
  medallion_layers:  # [REQUIRED] Medallion architecture justification
    required: false  # [REQUIRED] Boolean
    rationale: "string"  # [REQUIRED] Why medallion is/isn't needed

proof:  # [REQUIRED] Proof and demo strategy
  business_proof: "string"  # [REQUIRED] How to demonstrate business value
  user_experience_proof: "string"  # [REQUIRED] How to show improved user workflow
  technical_proof: "string"  # [REQUIRED] What technical capability to demonstrate
  demo_assets:  # [ARRAY] Assets needed for demo
    - "string"

value:  # [REQUIRED] Value measurement approach
  baseline_required: "string"  # [REQUIRED] What baseline to capture before solution
  target_kpis:  # [ARRAY] KPI targets
    - kpi: "string"  # [REQUIRED] KPI name
      baseline: "string"  # [REQUIRED] Current value or proxy
      target: "string"  # [REQUIRED] Target value
      measurement_grain: "string"  # [REQUIRED] How often measured
  measurement_method: "string"  # [REQUIRED] A/B / Before-after / Control group / Proxy
  value_hypothesis: "string"  # [REQUIRED] Expected $ impact or productivity gain

unknowns:  # [REQUIRED] Validation questions and assumptions
  customer_questions:  # [ARRAY] Questions to ask customer
    - "string"
  internal_questions:  # [ARRAY] Questions to validate internally
    - "string"
  assumptions:  # [ARRAY] Critical assumptions to validate
    - "string"

next_step:  # [REQUIRED] Immediate next action
  recommended_action: "string"  # [REQUIRED] Immediate next step
  success_criteria: "string"  # [REQUIRED] How to know this step succeeded
  timeline: "string"  # [OPTIONAL] Estimated duration

# ============================================================================
# FIELD DEFINITIONS AND VALIDATION RULES
# ============================================================================

# use_case.name
#   - Max 50 characters
#   - Should be descriptive enough to differentiate use cases
#   - Example: "Store/SKU Availability Prediction"

# use_case.business_problem
#   - Must state current friction AND business consequence
#   - Must be measurable (quantify impact where possible)
#   - Example: "Cannot predict stockouts, costing $50M annually in lost sales and overstock"

# use_case.business_outcome
#   - Must state desired future state AND measurable improvement
#   - Must tie to business KPI
#   - Example: "Reduce stockouts 20%, overstock 15%, increasing margin by $8M annually"

# use_case.persona
#   - Who makes the decision or takes the action (not just "user")
#   - Example: "Store operations manager", "Production planner", "CFO"

# use_case.decision_or_action
#   - Specific decision or action that will change
#   - Example: "Order quantity by SKU/store", "Production schedule adjustment", "Budget allocation"

# use_case.primary_kpi
#   - Must include baseline and target
#   - Example: "Forecast MAPE: 15% (current) → 8% (target)"

# context.constraints
#   - Time, budget, platform, governance, regulatory, skills, data availability
#   - Example: "3-month PoC timeline", "Must use existing SAP investment", "HIPAA compliance required"

# context.known_platforms.role
#   - Lead: Platform owns the domain, Databricks integrates
#   - Coexist: Platforms handle different workloads
#   - Integrate: Databricks extends platform capabilities
#   - Stay out: Platform fully owns, Databricks not involved

# solution_patterns.primary
#   - Must match a pattern in .assistant/solution-patterns.yaml
#   - Examples: "predictive-ml", "genai-knowledge-assistant", "cdc-modernization"

# solution_patterns.explicitly_not_required
#   - MUST document patterns that could be assumed but are not needed
#   - Example: "Pattern: real-time-operational-intelligence, Reason: Daily batch sufficient for 7-day forecast"

# skills.mandatory
#   - 00-solution-orchestrator always included
#   - Almost always include: 01, 02, 04
#   - Others based on pattern

# skills.explicitly_not_required
#   - MUST document skills that could be assumed but are not needed
#   - Example: "ID: 06-data-integration-cdc, Reason: Daily batch extract sufficient, no sub-hour latency need"
#   - This is the KEY anti-pattern prevention mechanism

# data.latency_requirement
#   - Batch (hours/days): Next-day or slower acceptable
#   - Near-real-time (minutes): 1-60 minutes acceptable
#   - Real-time (seconds): Sub-minute required

# data.required_inputs.status
#   - "Ready as-is": Data exists in usable form
#   - "Needs ingestion": Must ingest from source
#   - "Needs transformation": Exists but requires cleaning/enrichment

# architecture.medallion_layers.rationale
#   - MUST explicitly justify if medallion required OR NOT required
#   - Example (required): "Bronze for audit trail, Silver for current state + history, full medallion justified"
#   - Example (not required): "Curated data already exists in Snowflake, federated read sufficient, no medallion needed"

# value.measurement_method
#   - A/B test: Control vs treatment groups
#   - Before-after: Same cohort pre/post
#   - Control group: Non-intervention comparison
#   - Proxy: Leading indicator measurement

# unknowns
#   - What must be validated before committing to approach
#   - What assumptions could invalidate the solution
#   - What data/access/requirements are unclear

# next_step.recommended_action
#   - Immediate concrete next step
#   - Examples: "Schedule discovery call with operations team", "Validate SAP data extraction capability", "Build demand forecast prototype on 3-month history"

# ============================================================================
# ANTI-PATTERN VALIDATION
# ============================================================================

# The following MUST be explicitly addressed in skills.explicitly_not_required
# if they are not included in skills.mandatory or skills.conditional:
#
# - 05-data-source-assessment (if data already known/curated)
# - 06-data-integration-cdc (if batch sufficient)
# - 07-batch-data-engineering (if no transformation needed)
# - 08-streaming-realtime (if not sub-minute latency)
# - 11-bi-semantic-analytics (if not dashboard/BI consumption)
# - 12-ml-predictive-optimization (if not prediction/ML problem)
# - 13-genai-agents-rag (if not conversational/GenAI interface)
# - 14-data-sharing-cleanrooms (if not cross-org sharing)
# - 15-operational-serving-apps (if not operational action integration)

