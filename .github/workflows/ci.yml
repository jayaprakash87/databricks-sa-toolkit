name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate toolkit structure and frontmatter
        run: python3 scripts/validate_toolkit.py
      - name: Check selection matrix freshness
        run: python3 scripts/generate_matrix.py --check
      - name: Validate reference scenarios
        run: python3 scripts/check_scenarios.py --summary

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan for credentials and customer identifiers
        run: python3 scripts/security_scan.py

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install sa-kit
        run: pip install . pytest
      - name: Unit tests
        run: python3 -m pytest tests/ -q
      - name: Validate skills via CLI
        run: sa-kit validate
      - name: Installer dry run + install + uninstall roundtrip
        run: |
          mkdir /tmp/fake-repo
          cd /tmp/fake-repo
          export SA_KIT_ROOT=$GITHUB_WORKSPACE
          sa-kit install --agent claude --dry-run
          sa-kit install --agent claude
          test -f .claude/skills/solution-orchestrator/SKILL.md
          sa-kit install --agent claude --uninstall
          test ! -d .claude/skills
      - name: Engagement init + selection validation gates
        run: |
          cd /tmp
          export SA_KIT_ROOT=$GITHUB_WORKSPACE
          sa-kit engagement init ci-smoke
          if sa-kit validate --selection engagements/ci-smoke/engagement.yaml; then
            echo "empty selection should have failed" && exit 1
          fi
