scenario: fabric-powerbi-interop
description: >
  Coexistence over replacement. Power BI stays; Databricks is the governed
  foundation. Tests refusal of report rebuilds, data duplication, and forced
  Databricks-native BI.
must_select:
  - skill: business-problem-framing
    reason: Conflicting figures from unmanaged copies is the framed problem
  - skill: solution-architecture
    reason: Coexistence topology across Databricks, Power BI, and future Fabric
  - skill: platform-interoperability
    reason: Power BI/Fabric consuming governed Databricks data is the core capability
  - skill: bi-semantic-analytics
    reason: Semantic model strategy (DirectQuery/Direct Lake vs import) with the BI team
  - skill: governance-security
    reason: One governed copy with consistent access control across tools
must_exclude:
  - skill: data-integration-cdc
    reason: No new sources; the problem is consumption architecture, not ingestion
  - skill: batch-data-engineering
    reason: Existing engineering estate stays; no rebuild program will be approved
  - skill: ml-predictive-optimization
    reason: No prediction requirement
  - skill: genai-agents-rag
    reason: No language understanding requirement
  - skill: streaming-realtime
    reason: Reporting workloads; no event latency requirement
  - skill: data-sharing-cleanrooms
    reason: Internal tool coexistence, not cross-org collaboration
traps:
  - proposing Databricks dashboards to replace Power BI (rebuild explicitly forbidden)
  - solving duplication by copying data into Fabric instead of governed direct access
architecture_characteristics:
  - Power BI consuming Databricks directly (no import copies)
  - single governance model spanning consuming tools
  - Fabric-ready without committing to migration
expected_artifacts:
  - architecture decision record (consumption pattern)
  - solution blueprint
