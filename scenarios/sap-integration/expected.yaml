scenario: sap-integration
description: >
  Interop-led. SAP boundary constraints drive the architecture; extraction
  mechanism is conditional on the ERP team's tooling. No AI justified.
must_select:
  - skill: business-problem-framing
    reason: 3-week spreadsheet marathon to monthly reporting is the outcome
  - skill: solution-architecture
    reason: SAP boundary, change control, and blend with existing curated telemetry
  - skill: data-source-assessment
    reason: ODP/BW extract capabilities and SAP object coverage need assessment
  - skill: platform-interoperability
    reason: SAP coexistence with prohibited direct access is the core constraint
  - skill: governance-security
    reason: Finance postings are highly access-restricted
  - skill: bi-semantic-analytics
    reason: Margin-by-product-line reporting for finance analysts is the consumption
must_exclude:
  - skill: ml-predictive-optimization
    reason: No prediction requested; descriptive margin analytics
  - skill: genai-agents-rag
    reason: No language understanding requirement raised
  - skill: streaming-realtime
    reason: Monthly-to-weekly cadence; no event latency requirement
  - skill: data-sharing-cleanrooms
    reason: Internal analytics, no cross-org collaboration
conditional:
  - skill: data-integration-cdc
    reason: Only if the ERP team adopts event-based extraction tooling
  - skill: batch-data-engineering
    reason: Scheduled ODP/BW extracts imply batch transformation if CDC unavailable
traps:
  - proposing direct SAP database connections against stated change control
  - designing for the future S/4HANA estate instead of today's ECC reality
architecture_characteristics:
  - extraction via ERP-team-approved mechanisms only
  - finance data access controls preserved end to end
  - blend with existing curated plant telemetry (no re-ingestion)
expected_artifacts:
  - solution blueprint
  - architecture decision record (extraction mechanism)
