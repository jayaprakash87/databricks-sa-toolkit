scenario: operational-app
description: >
  Serving-led. Hourly curated data into an operational queue with actions.
  Tests that neither streaming nor ML nor GenAI gets forced onto a
  rules-based, hourly, embed-into-existing-tool problem.
must_select:
  - skill: business-problem-framing
    reason: Lost re-planning windows and dispatcher workload are the framed problem
  - skill: solution-architecture
    reason: Hourly pipeline into an existing console with action callbacks
  - skill: data-source-assessment
    reason: Fleet/scan exception tables and their hourly landing need verification
  - skill: operational-serving-apps
    reason: Prioritized queue with one-click actions inside the existing console
  - skill: governance-security
    reason: Customer notification actions touch customer data; access must be controlled
  - skill: observability-finops-performance
    reason: Dispatchers depend on the hourly refresh; missed refreshes are operational incidents
must_exclude:
  - skill: streaming-realtime
    reason: Act-within-the-hour explicitly stated; hourly batch meets the decision cadence
  - skill: ml-predictive-optimization
    reason: Prioritization uses existing business rules; no prediction requested
  - skill: genai-agents-rag
    reason: No language understanding requirement
  - skill: bi-semantic-analytics
    reason: Consumption is an action queue in the console, not dashboards
  - skill: data-integration-cdc
    reason: Exception signals already land hourly in curated tables
  - skill: data-sharing-cleanrooms
    reason: No cross-org collaboration
conditional:
  - skill: batch-data-engineering
    reason: Only if rule evaluation and impact scoring exceed what curated tables support
traps:
  - proposing streaming because exceptions sound real-time (decision cadence is hourly)
  - replacing the home-grown console the team refuses to abandon
architecture_characteristics:
  - hourly rule-based prioritization over existing curated tables
  - queue and actions embedded in the existing dispatcher console
  - refresh SLA monitoring with alerting
expected_artifacts:
  - solution blueprint
  - demo plan (dispatcher decision walkthrough)
